name: Build & Release

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14          # Apple Silicon (M1) runner
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      HAS_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cmake
        run: brew install cmake

      - name: Cache wxWidgets
        uses: actions/cache@v4
        with:
          path: deps
          key: wxwidgets-3.2.7-macos-14-arm64-${{ hashFiles('build.sh') }}

      - name: Build (Release)
        run: ./build.sh Release

      - name: Verify binary
        run: |
          file build/bin/TreeMaker.app/Contents/MacOS/TreeMaker
          echo "--- Dynamic libraries ---"
          otool -L build/bin/TreeMaker.app/Contents/MacOS/TreeMaker
          if otool -L build/bin/TreeMaker.app/Contents/MacOS/TreeMaker | grep -q pcre2; then
            echo "ERROR: binary still links against pcre2"
            exit 1
          fi
          build/bin/TreeMaker.app/Contents/MacOS/TreeMaker --help || true

      - name: Extract version
        id: version
        run: |
          major=$(grep '#define TM_VERSION_MAJOR' Source/tmVersion.h | awk '{print $3}')
          minor=$(grep '#define TM_VERSION_MINOR' Source/tmVersion.h | awk '{print $3}')
          echo "version=${major}.${minor}" >> "$GITHUB_OUTPUT"

      # --- Code Signing & Notarization ---
      - name: Import signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Decode certificate
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/certificate.p12

          # Create a temporary keychain
          KEYCHAIN_PATH="/tmp/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          security import /tmp/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add to search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          # Clean up certificate file
          rm -f /tmp/certificate.p12

      - name: Codesign app
        if: env.HAS_SIGNING == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          IDENTITY="Developer ID Application: ($APPLE_TEAM_ID)"
          # Find the actual identity name from the keychain
          IDENTITY=$(security find-identity -v -p codesigning /tmp/build.keychain-db \
            | grep "Developer ID Application" | head -1 \
            | sed 's/.*"\(.*\)".*/\1/')
          echo "Signing with: $IDENTITY"

          codesign --force --deep --options runtime \
            --sign "$IDENTITY" \
            --timestamp \
            build/bin/TreeMaker.app

          # Verify
          codesign --verify --deep --strict build/bin/TreeMaker.app
          echo "Codesign verified successfully"

      - name: Create DMG
        run: |
          DMG_NAME="TreeMaker-${{ steps.version.outputs.version }}-macOS-arm64.dmg"
          mkdir -p dmg-stage
          cp -R build/bin/TreeMaker.app dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname "TreeMaker" \
            -srcfolder dmg-stage \
            -ov -format UDZO \
            "${DMG_NAME}"
          echo "dmg_name=${DMG_NAME}" >> "$GITHUB_ENV"

      - name: Codesign DMG
        if: env.HAS_SIGNING == 'true'
        run: |
          IDENTITY=$(security find-identity -v -p codesigning /tmp/build.keychain-db \
            | grep "Developer ID Application" | head -1 \
            | sed 's/.*"\(.*\)".*/\1/')
          codesign --force --sign "$IDENTITY" --timestamp "${{ env.dmg_name }}"

      - name: Notarize DMG
        if: env.HAS_SIGNING == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        run: |
          xcrun notarytool submit "${{ env.dmg_name }}" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --wait --timeout 10m

          xcrun stapler staple "${{ env.dmg_name }}"
          echo "Notarization and stapling complete"

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain /tmp/build.keychain-db 2>/dev/null || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TreeMaker-macOS-arm64
          path: ${{ env.dmg_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: TreeMaker ${{ steps.version.outputs.version }}
          files: ${{ env.dmg_name }}
          generate_release_notes: true
          make_latest: true
